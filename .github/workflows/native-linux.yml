name: native-linux

# Нативный Wayland-захват на GPU (libpipewire + libva/libavcodec, cgo). Собираем
# ВНУТРИ Arch-контейнера, чтобы версии libpipewire/libva совпадали со SteamOS
# (тоже Arch) → бинарь запустится на Deck. Ручной запуск (workflow_dispatch),
# результат — артефакт katana-linux-amd64-native (без релиза/тега).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + bundle ffmpeg libs (cgo, Arch)
        run: |
          docker run --rm -v "$PWD":/src -w /src/proto archlinux:latest bash -c '
            set -e
            pacman -Sy --noconfirm archlinux-keyring
            pacman -Su --noconfirm
            pacman -S --noconfirm --needed base-devel go git pipewire libpipewire libva ffmpeg pkgconf
            git config --global --add safe.directory /src || true
            export CGO_CFLAGS_ALLOW=".*" CGO_LDFLAGS_ALLOW=".*"
            CGO_ENABLED=1 GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "-s -w" -o /src/katana-linux-amd64-native .
            file /src/katana-linux-amd64-native
            # Бандлим ffmpeg+кодек-либы рядом с бинарём, КРОМЕ системных (glibc,
            # GPU-драйвер/дисплей, PipeWire) — те должны быть с Deck, т.к. привязаны
            # к его железу/серверу. ldd даёт полное транзитивное замыкание.
            mkdir -p /src/native-libs
            DENY="ld-linux|/libc\.so|/libm\.so|/libmvec|libpthread|/libdl\.so|/librt\.so|libresolv|/libutil|libpipewire|/libva\.so|libva-|libdrm|libGL|libEGL|libgbm|libglapi|libX11|libxcb|libwayland|libstdc|libgcc_s"
            ldd /src/katana-linux-amd64-native | grep "=> /" | sed "s/.*=> //; s/ (0x.*//" | sort -u | while read -r lib; do
              echo "$lib" | grep -qE "$DENY" && continue
              cp -v "$lib" /src/native-libs/
            done
            echo "=== bundled ==="; ls -1 /src/native-libs
            tar -C /src -czf /src/native-libs.tar.gz native-libs
          '
      - uses: actions/upload-artifact@v4
        with:
          name: katana-linux-amd64-native
          path: katana-linux-amd64-native
          if-no-files-found: error
      # Публикуем как ассет пре-релиза (фиксированный тег native, обновляется на
      # месте) — чтобы steamos.sh качал его обычным curl без авторизации.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: native
          prerelease: true
          name: "Native Wayland (dev build)"
          files: |
            katana-linux-amd64-native
            native-libs.tar.gz
          fail_on_unmatched_files: true
