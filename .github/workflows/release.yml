name: release

# Релиз по тегу v*: ОТДЕЛЬНЫЙ бинарь под каждый таргет (без вранья про
# «универсальность» — каждый заточен под своё окружение). Хост-детект внутри всё
# равно есть, но артефакты собираются под конкретную платформу/профиль:
#
#   macos   — macOS arm64: cgo + ObjC (ScreenCaptureKit/VideoToolbox).
#   steamos — Steam Deck / SteamOS Desktop Mode: cgo, портал+PipeWire→VAAPI (KDE/
#             AMD/Wayland), dmabuf zero-copy + бандл ffmpeg. См. proto/capture/doc.go.
#   linux   — обычный Linux / сервер: CGO_ENABLED=0, без нативных либ, запускается
#             где угодно. Терминал по WebRTC + захват через внешний ffmpeg/gst
#             (x11grab / wayland-gst), ввод uinput/портал. amd64 + arm64.
#   windows — amd64: НАТИВНЫЙ in-process аппаратный H264-энкодер (winnative, cgo),
#             делящий D3D11-девайс с WGC-захватом (как OBS/Sunshine), GPU zero-copy
#             BGRA→NV12. Собирается на настоящем windows-раннере (cgo к D3D11/DXGI/
#             Media Foundation). ffmpeg нужен только для звука (WASAPI→ffmpeg→Opus).
#             arm64 пока не собираем (нужен arm64-раннер для cgo).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (например v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14 # arm64 (Apple Silicon)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proto/go.mod
      - name: Install libopus (static, для нативного Opus-энкодера)
        run: brew install opus
      - name: Build (darwin/arm64)
        working-directory: proto
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          CGO_ENABLED=1 GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o ../katana-macos-arm64 .
          ../katana-macos-arm64 -h 2>&1 | head -1 || true # smoke
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: katana-macos-arm64
          fail_on_unmatched_files: true

  # SteamOS (Steam Deck, Desktop Mode). Рецепт общий с dev-каналом steamos-dev.yml.
  steamos:
    uses: ./.github/workflows/build-steamos.yml
    with:
      release_tag: ${{ github.event.inputs.tag || github.ref_name }}
      prerelease: false

  # Обычный Linux / сервер: чистый Go, запускается где угодно (без нативных либ).
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proto/go.mod
      - name: Build (linux amd64 + arm64, CGO_ENABLED=0, портативный)
        working-directory: proto
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o ../katana-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o ../katana-linux-arm64 .
          ../katana-linux-amd64 --version || true # smoke
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            katana-linux-amd64
            katana-linux-arm64
          fail_on_unmatched_files: true

  # Windows amd64: НАТИВНЫЙ in-process аппаратный H264-энкодер (winnative, cgo) —
  # делит D3D11-девайс с WGC-захватом (как OBS/Sunshine), GPU zero-copy BGRA→NV12,
  # без ffmpeg-подпроцесса для видео. cgo к системным D3D11/DXGI/Media Foundation
  # требует виндового тулчейна (mingw из preinstalled), поэтому собираем на настоящем
  # windows-раннере, не кроссом. ffmpeg остаётся только для звука (WASAPI→Opus).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: proto/go.mod
      - name: gcc version (mingw, для cgo)
        shell: bash
        run: gcc --version
      - name: Build (windows amd64, cgo, winnative — in-process HW encoder)
        working-directory: proto
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          CGO_ENABLED: "1"
          GOARCH: amd64
        run: |
          go build -trimpath -tags winnative \
            -ldflags "-s -w -X main.version=$TAG" \
            -o ../katana-windows-amd64.exe .
          ls -la ../katana-windows-amd64.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: katana-windows-amd64.exe
          fail_on_unmatched_files: true
